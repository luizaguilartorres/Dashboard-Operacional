<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar usuário</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Mesmas variáveis de cor do login (tema da empresa de quem está logado) */
        :root {
            --btn-font-clr: #2B683E;
            --bg: #2B683E;
            --card-bg: #ffffff;
            --button-hover: #ffffff;
            --label-color: #2B683E;
        }

        body.porto {
            --btn-font-clr: #2A2725;
            --bg: #2A2725;
            --label-color: #2A2725;
        }

        body.sebastian {
            --btn-font-clr: #056089;
            --bg: #056089;
            --label-color: #056089;
        }

        body.flora {
            --btn-font-clr: #035A80;
            --bg: #55A5C7;
            --label-color: #035A80;
        }

        .pagina {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 0;
            background: var(--bg);
        }

        .card {
            width: 360px;
            background-color: var(--card-bg);
            border-radius: 40px;
            padding: 32px 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .logo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
            padding: 10px;
        }

        .logo-container img {
            max-width: 100%;
            max-height: 80px;
            object-fit: contain;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: var(--label-color);
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: 22px;
            font-weight: normal;
        }

        form {
            display: flex;
            flex-direction: column;
            color: var(--label-color);
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: 18px;
        }

        label {
            margin-top: 10px;
            margin-bottom: 4px;
            text-align: left;
        }

        input[type="text"],
        input[type="password"],
        select {
            height: 35px;
            border-color: var(--bg);
            border-radius: 6px;
            border-style: solid;
            padding: 0 10px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background-color: white;
        }

        select {
            cursor: pointer;
        }

        .linha-admin {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
        }

        .linha-admin input {
            width: 18px;
            height: 18px;
            accent-color: var(--bg);
        }

        .linha-admin label {
            margin: 0;
        }

        button {
            margin-top: 24px;
            background-color: var(--bg);
            color: #ffffff;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            border: none;
            border-radius: 6px;
            height: 35px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
        }

        button:hover {
            background-color: var(--button-hover);
            color: var(--btn-font-clr);
            transform: translateY(-2px);
            border: 2px solid var(--bg);
        }

        :focus-visible {
            outline: 3px solid var(--bg);
            outline-offset: 2px;
        }

        .mensagem {
            margin-top: 12px;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
        }

        .mensagem.erro {
            color: #c62828;
        }

        .mensagem.ok {
            color: #2e7d32;
        }

        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        .links a {
            color: var(--label-color);
        }
    </style>
</head>

<body class="{{ tema }}">
    <div class="pagina">
        <div class="card">
            <div class="logo-container">
                <img src="/static/img/{{ session['empresa'] }}.png" alt="Logo">
            </div>

            <h1>Criar usuário</h1>

            {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, texto in mensagens %}
            <p class="mensagem {{ categoria }}" role="status">{{ texto }}</p>
            {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('admin_usuarios') }}">
                <input type="hidden" name="csrf" value="{{ csrf_token() }}">

                <label for="nome">Nome de usuario</label>
                <input type="text" id="nome" name="nome" autocomplete="off" required>

                <label for="empresa">Empresa</label>
                <select id="empresa" name="empresa" required>
                    {% for chave, nome in empresas.items() %}
                    <option value="{{ chave }}">{{ nome }}</option>
                    {% endfor %}
                </select>

                <label for="senha">Senha (mínimo 8 caracteres)</label>
                <input type="password" id="senha" name="senha" minlength="8" autocomplete="new-password" required>

                <label for="confirmar">Confirmar senha</label>
                <input type="password" id="confirmar" name="confirmar" minlength="8" autocomplete="new-password" required>

                <div class="linha-admin">
                    <input type="checkbox" id="admin" name="admin">
                    <label for="admin">Este usuário é administrador</label>
                </div>

                <button type="submit">Criar usuário</button>
            </form>

            <div class="links">
                <a href="{{ url_for('dashboard', empresa_nome=session['empresa']) }}">Voltar ao dashboard</a>
                <a href="{{ url_for('logout') }}">Sair</a>
            </div>
        </div>
    </div>
</body>

</html>
